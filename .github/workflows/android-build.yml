name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Auto-Commit Log
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Keystore and Environment
        run: |
          echo "=== Setting up build environment ==="
          
          # 1. Ensure .env file exists for secrets-gradle-plugin
          if [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          else
            touch .env
            echo "Created empty .env"
          fi

          # 2. Restore or generate debug.keystore for debugConfig signing
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore using keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure gradlew is executable
          chmod +x gradlew
          echo "Build environment setup complete."

      - name: Run Gradle Build with Logging
        id: gradle_build
        run: |
          mkdir -p logs
          echo "=== Starting Gradle assembleDebug at $(date) ===" > logs/gradle-build.log

          # Pipe all build output (stdout and stderr) to both console and log file
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a logs/gradle-build.log
        continue-on-error: true

      - name: Commit and Push build.log to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f logs/gradle-build.log ]; then
            cp logs/gradle-build.log build.log
          else
            echo "No logs/gradle-build.log found" > build.log
          fi

          git add build.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: update build.log from GitHub Actions [skip ci]"
            # Fetch and rebase in case of concurrent commits
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
            echo "Successfully pushed updated build.log to repository branch ${{ github.ref_name }}"
          else
            echo "No changes in build.log to commit."
          fi

      - name: Generate Summary in GitHub Actions
        if: always()
        run: |
          echo "## Android Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gradle_build.outcome }}" == "success" ]; then
            echo "✅ **Build Succeeded!** APK generated successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Failed!**" >> $GITHUB_STEP_SUMMARY
            echo "The build log has been committed to **build.log** in this repository. Click 'Sync' in AI Studio to view it." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 100 lines of Gradle log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 logs/gradle-build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: logs/gradle-build.log
          retention-days: 30

      - name: Upload Debug APK (On Success)
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vintage-music-player-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Fail Job If Build Failed
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "Build failed. The log has been committed to build.log. Please sync your repo."
          exit 1
